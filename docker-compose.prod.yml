# Birokratko production stack: PostgreSQL (PostGIS + pgvector), the API, a one-shot SPA publisher and Caddy (TLS).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Deployment guide: docs/DEPLOYMENT.md
name: birokratko-prod

services:
  db:
    build: ./infra/db
    image: birokratko-db:prod
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1 -d nabavaradar']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  nabavaradar-api:
    build:
      context: .
      dockerfile: infra/python-api.Dockerfile
      args: { APP: nabavaradar }
    image: birokratko-api:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: prod
      APP_NAME: nabavaradar
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/nabavaradar
      PUBLIC_BASE_URL: https://${NABAVA_HOST:?set NABAVA_HOST in .env}
      CORS_ORIGINS: https://${NABAVA_HOST}
      RATE_LIMIT: ${RATE_LIMIT:-300/minute}
      SUDREG_CLIENT_ID: ${SUDREG_CLIENT_ID:-}
      SUDREG_CLIENT_SECRET: ${SUDREG_CLIENT_SECRET:-}
      SUDREG_BASE_URL: ${SUDREG_BASE_URL:-https://sudreg-data.gov.hr/api/javni}
      SUDREG_TOKEN_URL: ${SUDREG_TOKEN_URL:-https://sudreg-data.gov.hr/api/oauth/token}
      SUBSCRIPTION_SECRET: ${SUBSCRIPTION_SECRET:?set SUBSCRIPTION_SECRET in .env}
    volumes:
      - nabavaradar-data:/data

  # One-shot publisher: copies the built SPA into the shared "srv" volume, then exits.
  nabavaradar-web:
    build: { context: ., dockerfile: infra/web.Dockerfile, args: { APP: nabavaradar } }
    image: birokratko-web:prod
    volumes: ['srv:/srv']
    restart: 'no'

  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      NABAVA_HOST: ${NABAVA_HOST:?set NABAVA_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - srv:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nabavaradar-web: { condition: service_completed_successfully }
      nabavaradar-api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  nabavaradar-data:
  srv:
  caddy_data:
  caddy_config:
